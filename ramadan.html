<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#34215f">
  <meta name="description" content="Countdown to the expected beginning of Ramadan 1448 AH.">
  <title>Ramadan Countdown</title>
  <link rel="stylesheet" href="styles.css">
  <script src="countdown.js" defer></script>
</head>
<body class="ramadan-page">
  <main class="container" data-target="2027-02-08" data-finished="Ramadan Kareem!">
    <div class="eyebrow">A MONTH OF MERCY</div>
    <h1>🌙 Ramadan Kareem</h1>
    <p class="subtitle">Countdown to the Holy Month</p>

    <nav class="navigation" aria-label="Countdown pages">
      <a class="nav-link" href="index.html">🎖️ Military</a>
      <a class="nav-link active" href="ramadan.html" aria-current="page">🌙 Ramadan</a>
    </nav>

    <section class="countdown" aria-label="Time remaining">
      <div class="unit"><span class="number" id="days">0</span><span class="label">Days</span></div>
      <div class="unit"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
    </section>

    <p class="target-date"><strong>Expected Start Date:</strong> February 8, 2027</p>
    <p class="footnote">The date may vary depending on the moon sighting.</p>
  </main>
</body>
</html>
