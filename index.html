<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">
  <meta name="description" content="Countdown to the end of military service.">
  <title>Military Service Countdown</title>
  <link rel="stylesheet" href="styles.css">
  <script src="countdown.js" defer></script>
</head>
<body>
  <main class="container" data-target="2027-04-01" data-finished="Service Complete!">
    <div class="eyebrow">COUNTDOWN</div>
    <h1>🎖️ Military Service</h1>
    <p class="subtitle">Countdown to Freedom</p>

    <nav class="navigation" aria-label="Countdown pages">
      <a class="nav-link active" href="index.html" aria-current="page">🎖️ Military</a>
      <a class="nav-link" href="ramadan.html">🌙 Ramadan</a>
    </nav>

    <section class="countdown" aria-label="Time remaining">
      <div class="unit"><span class="number" id="days">0</span><span class="label">Days</span></div>
      <div class="unit"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
    </section>

    <p class="target-date"><strong>Service End Date:</strong> April 1, 2027</p>
    <p class="footnote">One second closer to the finish line.</p>
  </main>
</body>
</html>
